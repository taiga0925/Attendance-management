version: '3.8'

services:
  nginx:
    image: nginx:1.21.1
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./src:/var/www/
    depends_on:
      - php
    networks: # ★★★ 追記 ★★★
      - app-network

  php:
    build: ./docker/php
    volumes:
      - ./src:/var/www/
    networks: # ★★★ 追記 ★★★
      - app-network

  mysql:
    image: mysql:8.0.26
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: laravel_db
      MYSQL_USER: laravel_user
      MYSQL_PASSWORD: laravel_pass
    command:
      mysqld --default-authentication-plugin=mysql_native_password
    volumes:
      - ./docker/mysql/data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
    networks: # ★★★ 追記 ★★★
      - app-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    environment:
      - PMA_ARBITRARY=1
      - PMA_HOST=mysql
      - PMA_USER=laravel_user
      - PMA_PASSWORD=laravel_pass
    depends_on:
      - mysql
    ports:
      - 8080:80
    networks: # ★★★ 追記 ★★★
      - app-network

# ★★★ 追記 ★★★
  mailhog:
    image: 'mailhog/mailhog:latest'
    ports:
        - '1025:1025'
        - '8025:8025'
    networks: 
        - app-network

# 全てのサービスが接続するための共通ネットワーク 'app-network' を定義
networks:
  app-network:
    driver: bridge